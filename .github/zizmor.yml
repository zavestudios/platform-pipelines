rules:
  self-repository:
    ignore:
      # GitHub recommends $/ for same-repository reusable workflows, but the
      # actionlint version used by workflow CI does not yet recognize it.
      - container-build-dispatch.yml
      - workflow-ci.yml
      - workflow-main-ci.yml
  secrets-outside-env:
    ignore:
      # Reusable workflows consume caller-provided secrets and don't own
      # repository environments themselves, so zizmor's environment check
      # is noisy here. Keep the audit enabled everywhere else.
      - container-build-dispatch.yml
      - container-build.yml
      - container-promote.yml
