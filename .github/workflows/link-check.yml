name: Link Check

on:
  workflow_call:
    inputs:
      markdown_globs:
        description: 'Glob patterns for markdown files to check'
        required: false
        type: string
        default: '**/*.md'
      lychee_args:
        description: 'Additional lychee arguments'
        required: false
        type: string
        default: '--verbose --no-progress'
      fail_on_error:
        description: 'Fail workflow if broken links found'
        required: false
        type: boolean
        default: true

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2
        with:
          args: ${{ inputs.lychee_args }} ${{ inputs.markdown_globs }}
          fail: ${{ inputs.fail_on_error }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
