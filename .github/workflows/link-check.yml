name: Link Check

on:
  workflow_call:
    inputs:
      markdown_globs:
        description: >-
          Paths to check. Defaults to the repository root, which lychee walks
          itself. Prefer a path over a glob. A glob is wrong twice here: the
          value reaches a shell via eval in the action's entrypoint, and even
          when quoted so lychee expands it, "**/*.md" does not match files at
          the repository root — it requires at least one directory level.
        required: false
        type: string
        default: '.'
      lychee_args:
        description: 'Additional lychee arguments'
        required: false
        type: string
        default: '--verbose --no-progress'
      fail_on_error:
        description: 'Fail workflow if broken links found'
        required: false
        type: boolean
        default: true

jobs:
  link-check:
    name: Check Markdown Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links with lychee
        uses: lycheeverse/lychee-action@a8c4c7cb88f0c7386610c35eb25108e448569cb0 # v2
        with:
          # markdown_globs is single-quoted so a caller-supplied glob reaches
          # lychee intact instead of being expanded by the shell. Without the
          # quotes the previous default "**/*.md" collapsed to "*/*.md" —
          # bash does not treat ** as recursive unless globstar is set — so
          # the check silently scanned exactly one directory level.
          args: ${{ inputs.lychee_args }} '${{ inputs.markdown_globs }}'
          fail: ${{ inputs.fail_on_error }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
