name: Terraform Plan

on:
  workflow_call:
    inputs:
      tf_working_dir:
        description: 'Directory containing Terraform configuration'
        required: false
        type: string
        default: '.'
      terraform_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: 'latest'
      tf_var_file:
        description: 'Path to tfvars file (relative to tf_working_dir)'
        required: false
        type: string
        default: ''
      enable_fmt_check:
        description: 'Run terraform fmt -check'
        required: false
        type: boolean
        default: true
      additional_args:
        description: 'Additional arguments to pass to terraform plan'
        required: false
        type: string
        default: ''
    secrets:
      TF_VARS:
        description: 'Terraform variables as JSON (optional)'
        required: false

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Format Check
        if: ${{ inputs.enable_fmt_check }}
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color
      
      - name: Write TF Vars
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          if [ -n "$TF_VARS" ]; then
            printf '%s' "$TF_VARS" > terraform.auto.tfvars.json
          fi
      
      - name: Terraform Plan
        id: plan
        env:
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
          TF_VAR_FILE: ${{ inputs.tf_var_file }}
        run: |
          set -o pipefail
          ARGS=()
          if [ -n "$ADDITIONAL_ARGS" ]; then
            read -r -a ARGS <<< "$ADDITIONAL_ARGS"
          fi
          if [ -n "$TF_VAR_FILE" ]; then
            ARGS+=("-var-file=$TF_VAR_FILE")
          fi
          terraform plan -no-color -input=false "${ARGS[@]}" | tee plan.txt
        continue-on-error: true

      - name: Comment Plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        env:
          TF_WORKING_DIR: ${{ inputs.tf_working_dir }}
          FMT_OUTCOME: ${{ steps.fmt.outcome }}
          INIT_OUTCOME: ${{ steps.init.outcome }}
          VALIDATE_OUTCOME: ${{ steps.validate.outcome }}
          PLAN_OUTCOME: ${{ steps.plan.outcome }}
          GITHUB_ACTOR_NAME: ${{ github.actor }}
          GITHUB_WORKFLOW_NAME: ${{ github.workflow }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const path = `${process.env.TF_WORKING_DIR}/plan.txt`;
            const plan = fs.readFileSync(path, 'utf8');
            const maxLength = 65536;
            const truncatedPlan = plan.length > maxLength
              ? plan.substring(0, maxLength) + '\n\n... (truncated)'
              : plan;

            const output = `#### Terraform Format and Style 🖌\`${process.env.FMT_OUTCOME}\`
            #### Terraform Initialization ⚙️\`${process.env.INIT_OUTCOME}\`
            #### Terraform Validation 🤖\`${process.env.VALIDATE_OUTCOME}\`
            #### Terraform Plan 📖\`${process.env.PLAN_OUTCOME}\`

            <details><summary>Show Plan</summary>

            \`\`\`terraform
            ${truncatedPlan}
            \`\`\`

            </details>

            *Pusher: @${process.env.GITHUB_ACTOR_NAME}, Working Directory: \`${process.env.TF_WORKING_DIR}\`, Workflow: \`${process.env.GITHUB_WORKFLOW_NAME}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.owner,
              repo: context.repo,
              body: output
            });

      - name: Terraform Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
