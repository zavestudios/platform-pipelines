name: Dependabot Auto-Merge

on:
  workflow_call:
    inputs:
      auto_merge_major:
        description: 'Auto-merge major version updates (default: false - requires manual review)'
        type: boolean
        default: false
        required: false
      auto_merge_minor:
        description: 'Auto-merge minor version updates (default: true)'
        type: boolean
        default: true
        required: false
      auto_merge_patch:
        description: 'Auto-merge patch version updates (default: true)'
        type: boolean
        default: true
        required: false
      enable_auto_approve:
        description: 'Attempt PR approval before auto-merge (requires Actions approval permission)'
        type: boolean
        default: false
        required: false
      merge_method:
        description: 'Merge method to use (merge, squash, or rebase)'
        type: string
        default: 'squash'
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      startsWith(github.event.pull_request.head.ref, 'dependabot/') &&
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@21025c705c08248db411dc16f3619e6b5f9ea21a # v2
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"

      - name: Classify platform workflow updates
        id: platform_update
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
        run: |
          if [[ "${DEPENDENCY_NAMES}" == *"zavestudios/platform-pipelines"* ]]; then
            echo "requires_manual_review=true" >> "$GITHUB_OUTPUT"
          else
            echo "requires_manual_review=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-approve PR
        if: |
          inputs.enable_auto_approve == true &&
          steps.platform_update.outputs.requires_manual_review != 'true'
        run: gh pr review --approve "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Wait for checks to complete
        run: |
          echo "Waiting for all required checks to pass..."
          gh pr checks "$PR_URL" --required --watch --interval 10
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Validate merge method
        id: merge_method
        env:
          MERGE_METHOD: ${{ inputs.merge_method }}
        run: |
          case "$MERGE_METHOD" in
            merge|squash|rebase) echo "flag=--$MERGE_METHOD" >> "$GITHUB_OUTPUT" ;;
            *) echo "Invalid merge method: $MERGE_METHOD" >&2; exit 1 ;;
          esac

      - name: Enable auto-merge for patch updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-patch' &&
          steps.platform_update.outputs.requires_manual_review != 'true' &&
          inputs.auto_merge_patch == true
        run: |
          echo "Auto-merging patch update"
          gh pr merge --auto "$MERGE_FLAG" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_FLAG: ${{ steps.merge_method.outputs.flag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for minor updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
          steps.platform_update.outputs.requires_manual_review != 'true' &&
          inputs.auto_merge_minor == true
        run: |
          echo "Auto-merging minor update"
          gh pr merge --auto "$MERGE_FLAG" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_FLAG: ${{ steps.merge_method.outputs.flag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for major updates
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          steps.platform_update.outputs.requires_manual_review != 'true' &&
          inputs.auto_merge_major == true
        run: |
          echo "Auto-merging major update"
          gh pr merge --auto "$MERGE_FLAG" "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          MERGE_FLAG: ${{ steps.merge_method.outputs.flag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Comment on major updates requiring manual review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-major' &&
          inputs.auto_merge_major == false
        env:
          DEPENDENCY_NAMES: ${{ steps.metadata.outputs.dependency-names }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          body=$(cat <<EOF
          **Major version update detected**: ${DEPENDENCY_NAMES} from ${PREVIOUS_VERSION} to ${NEW_VERSION}

          Auto-merge is disabled for major updates in this repository. Please review the following before merging:
          - Breaking changes in the changelog
          - Migration guide (if any)
          - Test coverage for new behavior
          - Impact on dependent services

          Once reviewed, you can manually merge this PR.
          EOF
          )
          gh pr comment "$PR_URL" --body "$body"

      - name: Comment on platform updates requiring manual review
        if: |
          steps.platform_update.outputs.requires_manual_review == 'true' &&
          github.event.action == 'opened'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment "$PR_URL" --body "$(cat <<'EOF'
          This pull request updates shared ZaveStudios platform workflows and requires human review.

          Confirm the reusable-workflow interface, caller permissions, and repository checks before merging.
          EOF
          )"

      - name: Comment on minor updates requiring manual review
        if: |
          steps.metadata.outputs.update-type == 'version-update:semver-minor' &&
          inputs.auto_merge_minor == false
        run: |
          gh pr comment "$PR_URL" --body "**Minor version update**: Auto-merge is disabled for minor updates in this repository. Please review and merge manually."
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
