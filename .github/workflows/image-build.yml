name: Image Build

on:
  workflow_call:
    inputs:
      dockerfile:
        description: 'Dockerfile path'
        required: false
        type: string
        default: 'Dockerfile'
      tags:
        description: 'Image tags (comma or newline separated)'
        required: false
        type: string
        default: 'app:ci'
      push:
        description: 'Push image to registry'
        required: false
        type: boolean
        default: false
      load:
        description: 'Load image into local Docker'
        required: false
        type: boolean
        default: false
      build_args:
        description: 'Build args (newline separated)'
        required: false
        type: string
        default: ''
      platforms:
        description: 'Target platforms (comma separated, e.g. linux/amd64,linux/arm64)'
        required: false
        type: string
        default: ''
      target:
        description: 'Target stage for multi-stage Dockerfiles'
        required: false
        type: string
        default: ''
      cache_from:
        description: 'Cache sources (newline separated)'
        required: false
        type: string
        default: ''
      cache_to:
        description: 'Cache destinations (newline separated)'
        required: false
        type: string
        default: ''
  workflow_dispatch:

jobs:
  build:
    name: Build Image
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 #v4
        with:
          persist-credentials: false

      - name: Set up Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f #v3

      - name: Log in to GHCR
        if: ${{ inputs.push }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 #v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 #v5
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          tags: ${{ inputs.tags }}
          push: ${{ inputs.push }}
          load: ${{ inputs.load }}
          build-args: ${{ inputs.build_args }}
          platforms: ${{ inputs.platforms }}
          target: ${{ inputs.target }}
          cache-from: ${{ inputs.cache_from }}
          cache-to: ${{ inputs.cache_to }}
