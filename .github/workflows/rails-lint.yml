name: Rails Lint & Security

on:
  workflow_call:
    inputs:
      ruby_version:
        description: 'Ruby version to use'
        required: false
        type: string
        default: '3.2'
      run_rubocop:
        description: 'Run RuboCop linter'
        required: false
        type: boolean
        default: true
      run_brakeman:
        description: 'Run Brakeman security scanner'
        required: false
        type: boolean
        default: true
      run_bundler_audit:
        description: 'Run bundler-audit for dependency vulnerabilities'
        required: false
        type: boolean
        default: true
      rubocop_format:
        description: 'RuboCop output format'
        required: false
        type: string
        default: 'github'
      brakeman_format:
        description: 'Brakeman output format'
        required: false
        type: string
        default: 'text'

jobs:
  lint:
    name: Lint & Security Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Ruby
        uses: ruby/setup-ruby@09a7688d3b55cf0e976497ff046b70949eeaccfd # v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true

      - name: Run RuboCop
        if: ${{ inputs.run_rubocop }}
        env:
          RUBOCOP_FORMAT: ${{ inputs.rubocop_format }}
        run: |
          if [[ ! "$RUBOCOP_FORMAT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid rubocop_format: $RUBOCOP_FORMAT" >&2
            exit 1
          fi
          if bundle show rubocop > /dev/null 2>&1; then
            bundle exec rubocop --format "$RUBOCOP_FORMAT"
          else
            echo "RuboCop is not present in this repository bundle. Add rubocop and required plugins to the Gemfile." >&2
            exit 1
          fi
        continue-on-error: true

      - name: Run Brakeman
        if: ${{ inputs.run_brakeman }}
        env:
          BRAKEMAN_FORMAT: ${{ inputs.brakeman_format }}
        run: |
          if [[ ! "$BRAKEMAN_FORMAT" =~ ^[A-Za-z0-9_-]+$ ]]; then
            echo "Invalid brakeman_format: $BRAKEMAN_FORMAT" >&2
            exit 1
          fi
          if bundle show brakeman > /dev/null 2>&1; then
            bundle exec brakeman --format "$BRAKEMAN_FORMAT" --no-pager
          else
            echo "Brakeman is not present in this repository bundle. Add brakeman to the Gemfile." >&2
            exit 1
          fi

      - name: Update bundler-audit database
        if: ${{ inputs.run_bundler_audit }}
        run: |
          if bundle show bundler-audit > /dev/null 2>&1; then
            bundle exec bundle-audit update
          else
            echo "bundler-audit is not present in this repository bundle. Add bundler-audit to the Gemfile." >&2
            exit 1
          fi

      - name: Run bundler-audit
        if: ${{ inputs.run_bundler_audit }}
        run: |
          if bundle show bundler-audit > /dev/null 2>&1; then
            bundle exec bundle-audit check
          else
            echo "bundler-audit is not present in this repository bundle. Add bundler-audit to the Gemfile." >&2
            exit 1
          fi
