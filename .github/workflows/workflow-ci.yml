name: Workflow CI

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  shared-workflow-ref-policy:
    name: Enforce Shared Workflow SHA Pinning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Enforce immutable pins for shared platform workflows
        run: |
          violations="$(
            rg -n --pcre2 \
              'uses:\s*zavestudios/platform-pipelines/\.github/workflows/[^@[:space:]]+@(?![0-9a-f]{40}\b)[^[:space:]]+' \
              .github/workflows || true
          )"

          if [[ -n "${violations}" ]]; then
            cat <<EOF
          Found non-compliant shared workflow refs. Governed repositories must pin
          zavestudios/platform-pipelines reusable workflow refs to immutable
          40-character commit SHAs.

          Violations:
          ${violations}
          EOF
            exit 1
          fi

          echo "All zavestudios/platform-pipelines reusable workflow refs are pinned to immutable SHAs."

  actionlint:
    name: Lint Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@30f054494d5c1aa100ec4e57d1c7601100fc8f45 # v1.71.0

  zizmor:
    name: Audit Workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install zizmor
        run: cargo install --locked zizmor

      - name: Run zizmor
        run: |
          if [[ -f .github/zizmor.yml ]]; then
            zizmor --config .github/zizmor.yml .github/workflows
          else
            zizmor .github/workflows
          fi

  smoke-security-scan:
    name: Smoke Reusable Security Scan
    if: github.repository == 'zavestudios/platform-pipelines'
    needs:
      - shared-workflow-ref-policy
      - actionlint
      - zizmor
    uses: ./.github/workflows/security-scan.yml
    with:
      fetch_depth: 1

  smoke-container-build:
    name: Smoke Reusable Container Build
    if: github.repository == 'zavestudios/platform-pipelines'
    needs:
      - shared-workflow-ref-policy
      - actionlint
      - zizmor
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/container-build.yml
    with:
      image_name: local/smoke-image-build
      context: .github/fixtures/image-build
      dockerfile: .github/fixtures/image-build/Dockerfile
      platforms: linux/amd64
      push: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
