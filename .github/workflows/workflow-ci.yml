name: Workflow CI

on:
  pull_request:
    paths:
      - .github/workflows/**
      - .github/fixtures/**
  push:
    branches:
      - main
    paths:
      - .github/workflows/**
      - .github/fixtures/**
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  actionlint:
    name: Lint Workflows (actionlint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: reviewdog/action-actionlint@30f054494d5c1aa100ec4e57d1c7601100fc8f45 # v1.71.0

  zizmor:
    name: Audit Workflows (zizmor)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Install zizmor
        run: cargo install --locked zizmor

      - name: Run zizmor
        run: zizmor --config .github/zizmor.yml .github/workflows

  smoke-security-scan:
    name: Smoke Reusable Security Scan
    uses: ./.github/workflows/security-scan.yml
    with:
      fetch_depth: 1

  smoke-container-build:
    name: Smoke Reusable Container Build
    permissions:
      contents: read
      packages: write
      id-token: write
    uses: ./.github/workflows/container-build.yml
    with:
      image_name: local/smoke-image-build
      context: .github/fixtures/image-build
      dockerfile: .github/fixtures/image-build/Dockerfile
      platforms: linux/amd64
      push: false
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
