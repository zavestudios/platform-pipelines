name: Validate Jekyll Front Matter

on:
  workflow_call:
    inputs:
      python_version:
        description: 'Python version to use'
        required: false
        type: string
        default: '3.11'
      validation_script:
        description: 'Path to validation script'
        required: false
        type: string
        default: 'scripts/validate_front_matter.py'

jobs:
  validate-front-matter:
    name: Validate Front Matter
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python_version }}

      - name: Install deps
        run: pip install pyyaml python-dateutil

      - name: Validate posts
        env:
          VALIDATION_SCRIPT: ${{ inputs.validation_script }}
        run: python "$VALIDATION_SCRIPT"
