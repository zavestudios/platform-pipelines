name: Terraform Apply

on:
  workflow_call:
    inputs:
      tf_working_dir:
        description: 'Directory containing Terraform configuration'
        required: false
        type: string
        default: '.'
      terraform_version:
        description: 'Terraform version to use'
        required: false
        type: string
        default: 'latest'
      tf_var_file:
        description: 'Path to tfvars file (relative to tf_working_dir)'
        required: false
        type: string
        default: ''
      additional_args:
        description: 'Additional arguments to pass to terraform apply'
        required: false
        type: string
        default: ''
    secrets:
      TF_VARS:
        description: 'Terraform variables as JSON (optional)'
        required: false

jobs:
  apply:
    name: Terraform Apply
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ${{ inputs.tf_working_dir }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: ${{ inputs.terraform_version }}

      - name: Terraform Init
        id: init
        run: terraform init

      - name: Write TF Vars
        env:
          TF_VARS: ${{ secrets.TF_VARS }}
        run: |
          if [ -n "$TF_VARS" ]; then
            printf '%s' "$TF_VARS" > terraform.auto.tfvars.json
          fi

      - name: Terraform Apply
        id: apply
        env:
          ADDITIONAL_ARGS: ${{ inputs.additional_args }}
          TF_VAR_FILE: ${{ inputs.tf_var_file }}
        run: |
          ARGS=()
          if [ -n "$ADDITIONAL_ARGS" ]; then
            read -r -a ARGS <<< "$ADDITIONAL_ARGS"
          fi
          if [ -n "$TF_VAR_FILE" ]; then
            ARGS+=("-var-file=$TF_VAR_FILE")
          fi
          terraform apply -auto-approve -input=false "${ARGS[@]}"
