name: Deploy Hugo site to Pages

on:
  workflow_call:
    inputs:
      go_version:
        description: "Go version to use"
        required: false
        type: string
        default: "1.22"
      hugo_version:
        description: "Hugo version to use"
        required: false
        type: string
        default: "latest"
      hugo_extended:
        description: "Use Hugo extended"
        required: false
        type: boolean
        default: true
      hugo_environment:
        description: "Hugo environment"
        required: false
        type: string
        default: "production"
      goprivate:
        description: "GOPRIVATE value"
        required: false
        type: string
        default: ""
      gonosumdb:
        description: "GONOSUMDB value"
        required: false
        type: string
        default: ""
      hugo_args:
        description: "Extra hugo args"
        required: false
        type: string
        default: ""

jobs:
  build:
    name: Build Hugo Site
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ inputs.go_version }}

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@e3b661c523413d13d642651a5ba5fc0d2b344c0d # v3
        with:
          hugo-version: ${{ inputs.hugo_version }}
          extended: ${{ inputs.hugo_extended }}

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Ensure Relearn Theme
        run: |
          if [ ! -d themes/hugo-theme-relearn ]; then
            git clone --depth 1 https://github.com/McShelby/hugo-theme-relearn themes/hugo-theme-relearn
          fi

      - name: Debug config
        run: |
          pwd
          ls -la
          ls -la hugo.toml
          sed -n '1,120p' hugo.toml

      - name: Update Hugo Modules
        env:
          GOPRIVATE: ${{ inputs.goprivate }}
          GONOSUMDB: ${{ inputs.gonosumdb }}
        run: hugo mod get -u

      - name: Build
        env:
          GOPRIVATE: ${{ inputs.goprivate }}
          GONOSUMDB: ${{ inputs.gonosumdb }}
          HUGO_ENVIRONMENT: ${{ inputs.hugo_environment }}
          HUGO_ENV: ${{ inputs.hugo_environment }}
          BASE_URL: ${{ steps.pages.outputs.base_url }}
          HUGO_ARGS: ${{ inputs.hugo_args }}
        run: |
          EXTRA_ARGS=()
          if [ -n "$HUGO_ARGS" ]; then
            read -r -a EXTRA_ARGS <<< "$HUGO_ARGS"
          fi
          hugo --config hugo.toml --minify --baseURL "$BASE_URL" "${EXTRA_ARGS[@]}"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./public

  deploy:
    name: Deploy to GitHub Pages
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
